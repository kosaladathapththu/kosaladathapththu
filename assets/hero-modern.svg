<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#060B1F"/>
      <stop offset="0.48" stop-color="#0C1232"/>
      <stop offset="1" stop-color="#07152B"/>
    </linearGradient>
    <linearGradient id="accent" x1="170" y1="40" x2="1040" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.52" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0" cy="0" r="1" gradientTransform="translate(965 126) rotate(150) scale(250 170)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientTransform="translate(785 270) rotate(15) scale(270 155)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A855F7" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#7DD3FC" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000814" flood-opacity="0.58"/>
    </filter>
    <style>
      .mono { font-family: "JetBrains Mono", "Fira Code", Consolas, monospace; }
      .sans { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: center; }
      .float-a { animation: floatA 5.2s ease-in-out infinite; }
      .float-b { animation: floatB 6.4s ease-in-out infinite; }
      .scan { animation: scan 4.8s linear infinite; }
      .dash { stroke-dasharray: 10 14; animation: dash 12s linear infinite; }
      .blink { animation: blink 1.2s steps(2,end) infinite; }
      @keyframes pulse { 0%,100% { opacity:.45; transform:scale(.85) } 50% { opacity:1; transform:scale(1.18) } }
      @keyframes floatA { 0%,100% { transform:translateY(0px) } 50% { transform:translateY(-10px) } }
      @keyframes floatB { 0%,100% { transform:translate(0,0) } 50% { transform:translate(6px,-8px) } }
      @keyframes scan { 0% { transform:translateX(-320px); opacity:0 } 12% { opacity:.55 } 88% { opacity:.55 } 100% { transform:translateX(1260px); opacity:0 } }
      @keyframes dash { to { stroke-dashoffset:-240 } }
      @keyframes blink { 50% { opacity:0 } }
      @media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="358" rx="28" fill="url(#bg)" stroke="#263665" stroke-width="2"/>
  <rect x="24" y="24" width="1152" height="312" rx="22" fill="url(#grid)" opacity="0.75"/>
  <rect x="24" y="24" width="1152" height="312" rx="22" fill="url(#glow1)"/>
  <rect x="24" y="24" width="1152" height="312" rx="22" fill="url(#glow2)"/>

  <path d="M44 81H1156" stroke="#263665" stroke-opacity="0.62"/>
  <circle cx="58" cy="53" r="5" fill="#22D3EE"/>
  <circle cx="78" cy="53" r="5" fill="#60A5FA" fill-opacity="0.65"/>
  <circle cx="98" cy="53" r="5" fill="#A855F7" fill-opacity="0.62"/>
  <text x="120" y="59" fill="#8EA6CF" font-size="13" letter-spacing="2.4" class="mono">PROFILE://KOSALA.ATHAPATHTHU</text>
  <text x="1058" y="59" fill="#5EEAD4" font-size="12" text-anchor="end" class="mono">ONLINE</text>
  <circle cx="1080" cy="54" r="5" fill="#34D399" class="pulse"/>

  <g transform="translate(68 112)">
    <text x="0" y="0" fill="#22D3EE" font-size="14" letter-spacing="5" class="mono">HELLO, DIGITAL UNIVERSE</text>
    <text x="0" y="63" fill="#F8FAFC" font-size="54" font-weight="800" letter-spacing="1" class="sans">KOSALA ATHAPATHTHU</text>
    <text x="0" y="101" fill="#B7C7E6" font-size="19" font-weight="700" letter-spacing="2" class="sans">SOFTWARE ENGINEER  •  FULL-STACK  •  IoT</text>

    <g transform="translate(0 132)">
      <rect width="100" height="34" rx="17" fill="#071F32" stroke="#22D3EE"/>
      <text x="50" y="22" text-anchor="middle" fill="#67E8F9" font-size="12" font-weight="700" class="sans">REACT</text>
      <rect x="112" width="132" height="34" rx="17" fill="#24143D" stroke="#A855F7"/>
      <text x="178" y="22" text-anchor="middle" fill="#D8B4FE" font-size="12" font-weight="700" class="sans">SPRING BOOT</text>
      <rect x="256" width="72" height="34" rx="17" fill="#34121E" stroke="#FB7185"/>
      <text x="292" y="22" text-anchor="middle" fill="#FDA4AF" font-size="12" font-weight="700" class="sans">IoT</text>
      <rect x="340" width="86" height="34" rx="17" fill="#082A31" stroke="#2DD4BF"/>
      <text x="383" y="22" text-anchor="middle" fill="#5EEAD4" font-size="12" font-weight="700" class="sans">CLOUD</text>
    </g>

    <g transform="translate(0 194)">
      <circle cx="5" cy="0" r="5" fill="#34D399" class="pulse"/>
      <text x="20" y="5" fill="#8EA6CF" font-size="13" class="mono">status: engineering tomorrow</text>
      <rect x="281" y="-10" width="8" height="18" rx="1" fill="#22D3EE" class="blink"/>
    </g>
  </g>

  <g transform="translate(826 100)" filter="url(#shadow)">
    <path d="M133 0L240 62V186L133 248L26 186V62L133 0Z" fill="#0C1738" fill-opacity="0.93" stroke="url(#accent)" stroke-width="3" filter="url(#softGlow)"/>
    <path d="M133 18L224 71V177L133 230L42 177V71L133 18Z" fill="#0B1530" stroke="#273C6A"/>
    <circle cx="133" cy="122" r="70" fill="none" stroke="url(#accent)" stroke-width="2" class="dash"/>
    <circle cx="133" cy="122" r="48" fill="#07152B" stroke="#334879"/>
    <text x="133" y="115" text-anchor="middle" fill="#67E8F9" font-size="16" font-weight="800" class="sans">SLT-MOBITEL</text>
    <text x="133" y="140" text-anchor="middle" fill="#A78BFA" font-size="12" letter-spacing="2" class="mono">SOFTWARE INTERN</text>
    <circle cx="133" cy="31" r="7" fill="#22D3EE" class="pulse"/>
    <circle cx="219" cy="132" r="6" fill="#A855F7" class="pulse"/>
    <circle cx="53" cy="173" r="5" fill="#34D399" class="pulse"/>
  </g>

  <g class="float-a">
    <rect x="1000" y="80" width="130" height="55" rx="14" fill="#0B1730" stroke="#334879"/>
    <text x="1018" y="103" fill="#7DD3FC" font-size="10" letter-spacing="1.5" class="mono">TELEMETRY</text>
    <path d="M1018 119L1035 113L1054 120L1070 103L1090 111L1112 96" stroke="#22D3EE" stroke-width="2" fill="none"/>
  </g>
  <g class="float-b">
    <rect x="735" y="250" width="132" height="54" rx="14" fill="#0B1730" stroke="#334879"/>
    <text x="751" y="273" fill="#C4B5FD" font-size="10" letter-spacing="1.3" class="mono">DEPLOYMENT</text>
    <text x="751" y="291" fill="#34D399" font-size="12" font-weight="700" class="mono">● STABLE</text>
  </g>

  <rect x="0" y="0" width="330" height="360" fill="url(#accent)" opacity="0.06" class="scan"/>
</svg>