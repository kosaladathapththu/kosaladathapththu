<svg width="1200" height="430" viewBox="0 0 1200 430" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Kosala's software engineering journey</title>
<desc id="desc">Animated timeline showing internship, renewable-energy dashboards, IoT integration, production systems, and future engineering goals.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="430" gradientUnits="userSpaceOnUse">
    <stop stop-color="#060A18"/>
    <stop offset=".5" stop-color="#0B1230"/>
    <stop offset="1" stop-color="#07182C"/>
  </linearGradient>
  <linearGradient id="line" x1="90" y1="0" x2="1110" y2="0" gradientUnits="userSpaceOnUse">
    <stop stop-color="#22D3EE"/>
    <stop offset=".55" stop-color="#60A5FA"/>
    <stop offset="1" stop-color="#A855F7"/>
  </linearGradient>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#8BD5FF" stroke-opacity=".045"/>
  </pattern>
  <style>
    .sans{font-family:"Segoe UI",Arial,sans-serif}
    .mono{font-family:Consolas,"Courier New",monospace}
    .flow{stroke-dasharray:12 13;animation:flow 10s linear infinite}
    .pulse{animation:pulse 2.3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .pulse2{animation:pulse 2.3s ease-in-out .55s infinite;transform-box:fill-box;transform-origin:center}
    .pulse3{animation:pulse 2.3s ease-in-out 1.1s infinite;transform-box:fill-box;transform-origin:center}
    .float{animation:float 5s ease-in-out infinite}
    @keyframes flow{to{stroke-dashoffset:-250}}
    @keyframes pulse{0%,100%{opacity:.5;transform:scale(.82)}50%{opacity:1;transform:scale(1.2)}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
</defs>
<rect x="1" y="1" width="1198" height="428" rx="28" fill="url(#bg)" stroke="#263665" stroke-width="2"/>
<rect x="22" y="22" width="1156" height="386" rx="22" fill="url(#grid)"/>
<text x="600" y="62" text-anchor="middle" fill="#F8FAFC" font-size="28" font-weight="800" class="sans">KOSALA'S DEVELOPER JOURNEY</text>
<text x="600" y="88" text-anchor="middle" fill="#8EA6CF" font-size="13" letter-spacing="2" class="mono">LEARNING → BUILDING → INTEGRATING → DEPLOYING → LEADING</text>

<path d="M100 214H1100" stroke="#263665" stroke-width="8" stroke-linecap="round"/>
<path d="M100 214H1100" stroke="url(#line)" stroke-width="4" stroke-linecap="round" class="flow" filter="url(#glow)"/>

<g transform="translate(125 214)">
  <circle r="16" fill="#07182C" stroke="#22D3EE" stroke-width="3"/>
  <circle r="6" fill="#22D3EE" class="pulse"/>
  <rect x="-85" y="-105" width="170" height="70" rx="14" fill="#09162D" stroke="#2B4070"/>
  <text y="-79" text-anchor="middle" fill="#67E8F9" font-size="13" font-weight="700" class="sans">MAY 2026</text>
  <text y="-57" text-anchor="middle" fill="#D7E3F8" font-size="12" class="sans">SLT-Mobitel internship</text>
  <text y="-40" text-anchor="middle" fill="#91A8CE" font-size="10" class="mono">industry entry</text>
</g>

<g transform="translate(365 214)">
  <circle r="16" fill="#07182C" stroke="#38BDF8" stroke-width="3"/>
  <circle r="6" fill="#38BDF8" class="pulse2"/>
  <rect x="-92" y="38" width="184" height="82" rx="14" fill="#09162D" stroke="#2B4070"/>
  <text y="65" text-anchor="middle" fill="#7DD3FC" font-size="13" font-weight="700" class="sans">JUNE 2026</text>
  <text y="87" text-anchor="middle" fill="#D7E3F8" font-size="12" class="sans">Energy dashboards</text>
  <text y="105" text-anchor="middle" fill="#91A8CE" font-size="10" class="mono">solar • hydro • wind</text>
</g>

<g transform="translate(600 214)">
  <circle r="18" fill="#07182C" stroke="#60A5FA" stroke-width="3"/>
  <circle r="7" fill="#60A5FA" class="pulse3"/>
  <rect x="-102" y="-112" width="204" height="78" rx="14" fill="#0A1732" stroke="#39558B" class="float"/>
  <text y="-84" text-anchor="middle" fill="#93C5FD" font-size="13" font-weight="700" class="sans">JULY 2026</text>
  <text y="-62" text-anchor="middle" fill="#F1F5F9" font-size="12" class="sans">React + Node-RED + IoT</text>
  <text y="-44" text-anchor="middle" fill="#AAB8D4" font-size="10" class="mono">live telemetry integration</text>
</g>

<g transform="translate(835 214)">
  <circle r="16" fill="#07182C" stroke="#818CF8" stroke-width="3"/>
  <circle r="6" fill="#818CF8" class="pulse"/>
  <rect x="-96" y="38" width="192" height="82" rx="14" fill="#10142F" stroke="#4A4F91"/>
  <text y="65" text-anchor="middle" fill="#A5B4FC" font-size="13" font-weight="700" class="sans">NOW</text>
  <text y="87" text-anchor="middle" fill="#F1F5F9" font-size="12" class="sans">Production-minded systems</text>
  <text y="105" text-anchor="middle" fill="#AAB8D4" font-size="10" class="mono">reliability • UX • data</text>
</g>

<g transform="translate(1075 214)">
  <circle r="16" fill="#07182C" stroke="#A855F7" stroke-width="3"/>
  <circle r="6" fill="#A855F7" class="pulse2"/>
  <rect x="-91" y="-105" width="182" height="70" rx="14" fill="#17102E" stroke="#65439A"/>
  <text y="-79" text-anchor="middle" fill="#D8B4FE" font-size="13" font-weight="700" class="sans">NEXT</text>
  <text y="-57" text-anchor="middle" fill="#F1F5F9" font-size="12" class="sans">Full-stack engineer</text>
  <text y="-40" text-anchor="middle" fill="#B7A6D5" font-size="10" class="mono">cloud • architecture • AI</text>
</g>

<g transform="translate(355 355)">
  <rect width="490" height="42" rx="21" fill="#08142D" stroke="#2B4070"/>
  <circle cx="25" cy="21" r="5" fill="#34D399" class="pulse"/>
  <text x="44" y="26" fill="#AFC3E8" font-size="12" class="mono">trajectory: practical software with measurable real-world value</text>
</g>
</svg>